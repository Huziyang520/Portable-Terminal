plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    // Optional integrations, compile only. Every module that compiles the common sources needs
    // them on its own compile classpath; declaring them in common alone is not enough.
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    mappings loom.officialMojangMappings()
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    modCompileOnly('me.shedaniel.cloth:cloth-config-fabric:11.1.136') { transitive = false }
    modCompileOnly('com.terraformersmc:modmenu:7.2.2') { transitive = false }
    // JEI（可选前置）：只编译期引用仓库内自带的 API 工件；不打包、不设必装依赖。
    compileOnly files('../common/libs/jei-1.20.1-common-api-15.62.0.219.jar')
}

// 本分支的 Gradle 跑在 Java 21/17 上，而 CurseForgeGradle 1.3.33 要求 JVM 25 ⇒ 不能作为构建插件加载。
// 发布统一走 文档/上传脚本 的 gradle init 脚本（cfUpload / mrUpload），本文件不再注册 curseforge 任务。

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
