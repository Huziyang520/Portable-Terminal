plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'net.darkhax.curseforgegradle' version '1.3.33'
}

sourceSets.main.java.srcDir rootProject.file('../../spec/java')

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // 配置界面与 config 数据都来自 Forge Config API Port（必选前置，不打包）。
    compileOnly files("libs/forge-config-api-port-26.3.1.jar")
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    // 可选：JEI 避让。只编译期引用仓库内自带的 API 工件，不打包、不设必装依赖。
    compileOnly files("../common/libs/${jei_api_jar}")
}

// CurseForge 发布：gradlew -p targets/<区间> :fabric:curseforge
tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = project.findProperty('curseforge_api_key')
    def cf = upload(project.curseforge_project_id, tasks.named('jar'))
    cf.displayName = "${mod_name} ${version} (Fabric)"
    cf.changelog = project.findProperty('curseforge_changelog') ?: "Release ${version}. Full change list: https://github.com/Huziyang520/Portable-Terminal"
    cf.changelogType = 'markdown'
    cf.releaseType = project.curseforge_release_type
    cf.addGameVersion(*project.curseforge_game_versions.split(','))
    cf.addModLoader('Fabric')
}

loom {
    accessWidenerPath.set(project(':common').pickResource("${mod_id}.accesswidener"))
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
