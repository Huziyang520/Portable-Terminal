plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    // 可选前置只编译期引用，运行时缺失必须不报错。
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // 本模块在 named(mojmap) 空间编译 common 的源码，fabric 工件是 intermediary 的 ⇒ 必须经 Loom remap。
    modCompileOnly("${cloth_config_fabric}") { transitive = false }
    modCompileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    // 可选：JEI 避让。只编译期引用仓库内自带的 API 工件，不打包、不设必装依赖。
    compileOnly files("../common/libs/${jei_api_jar}")
}

loom {
    accessWidenerPath.set(project(':common').pickResource("${mod_id}.accesswidener"))
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
