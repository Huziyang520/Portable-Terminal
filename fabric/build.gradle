plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'net.darkhax.curseforgegradle' version '1.3.33'
}

repositories {
    // Optional integrations, compile only. Every module that compiles the common sources needs
    // them on its own compile classpath; declaring them in common alone is not enough.
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    compileOnly('me.shedaniel.cloth:cloth-config-fabric:26.2.155') { transitive = false }
    compileOnly('com.terraformersmc:modmenu:20.0.3') { transitive = false }
    // JEI 是可选前置：只编译期引用，API 工件随仓库放在 common/libs，不打包、不设必装依赖。
    compileOnly files('../common/libs/jei-26.2-common-api-30.42.0.236.jar')
}

// CurseForge 发布：gradlew :fabric:curseforge
tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = project.findProperty('curseforge_api_key')
    def cf = upload(project.curseforge_project_id, tasks.named('jar'))
    cf.displayName = "${mod_name} ${version} (Fabric)"
    cf.changelog = project.findProperty('curseforge_changelog') ?: "Release ${version}. Full change list: https://github.com/Huziyang520/Portable-Terminal"
    cf.changelogType = 'markdown'
    cf.releaseType = project.curseforge_release_type
    cf.addGameVersion(*project.curseforge_game_versions.split(','))
    cf.addModLoader('Fabric')
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.matching { it.name == variant }.configureEach {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
