plugins {
    id 'java-library'
    id 'maven-publish'
}

// Release artefact name: <mod_id>-<version>-<loader>-<MC or range>.
// The version is folded into archivesName, so archiveVersion must be cleared
// (otherwise Loom's remapJar / the plain jar task appends it a second time).
base {
    archivesName = "${mod_id}-${version}-${project.name}-${mc_range_label}"
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = ''
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

// 1.20.2-1.20.4 档：NeoForm/vanilla 产物是 Java 21 字节码（major 65），javac 17 读不了它，
// 会报“该文件内含版本 65.0, 应为 61.0”并导致整片符号解析失败。因此用 JDK 21 编译，
// 再用 --release 把本模组产物字节码锁回区间下界的运行时档（1.20.2-1.20.4 仍跑 Java 17）。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    def javaTarget = findProperty('java_target_version')
    if (javaTarget != null) {
        options.release = javaTarget.toString().toInteger()
    }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}


repositories {
    // Cloth Config / Mod Menu 只在这两个仓库里，必须排在最前：本机对 maven.neoforged.net 不可达，
    // 一旦先去查它（连接被代理重置 / 直连超时），modCompileOnly 的解析会把**配置阶段**直接拖死甚至失败。
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    // 国内镜像优先；官方源在后。
    maven { name = 'AliyunCentral'; url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
    // 不要在这里自建 maven.neoforged.net 仓库：本机对该域名不可达（直连超时、走代理被重置），
    // 而「自己声明一个 URL 相同的仓库」会换掉 Gradle 算出的 repository id，让**已经缓存好的**
    // net.neoforged:* 元数据变成未命中；更糟的是解析第三方工件（cloth-config / modmenu 等）时
    // 会按顺序先撞上这个不可达仓库，把整个配置阶段拖死。交给 ModDevGradle 自己注入 NeoForged 源。
    maven { name = 'Mojang'; url = 'https://libraries.minecraft.net/' }
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public' }
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    // 容忍缺项：区间不同时并不存在 neoforge_* / forge_* 两组属性。
    var expandKeys = [
            'version', 'group', 'minecraft_version', 'minecraft_version_range', 'fabric_minecraft_range',
            'mc_range_label', 'fabric_version', 'fabric_loader_version', 'mod_name', 'mod_author',
            'mod_id', 'license', 'description', 'credits', 'java_version',
            'neoforge_version', 'neoforge_version_range', 'neoforge_loader_version_range',
            'forge_version', 'forge_loader_version_range'
    ]
    var expandProps = [:]
    expandKeys.each { key ->
        def value = findProperty(key)
        if (value != null) {
            expandProps[key] = value
        }
    }

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
}
