pluginManagement {
    repositories {
        maven { name = 'Aliyun Gradle Plugin Portal'; url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven { name = 'Fabric'; url = uri('https://maven.fabricmc.net') }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'portableterminal'
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')
