# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.2.0
group=com.portableterminal
java_version=21
# 产物字节码目标：本档 NeoForm 产物是 Java 21（major 65），javac 17 读不了；
# 用 JDK 21 编译、--release 17 把本模组产物压回 major 61，与 1.20.2-1.20.4 的 Java 17 运行时一致。
java_target_version=17

# Common
minecraft_version=1.20.4
mod_name=Portable Terminal
mod_author=Huziyang520
mod_id=portableterminal

# CurseForge 发布（API Key 在 ~/.gradle/gradle.properties 的 curseforge_api_key，不入库）
# 顺序即 CurseForge 上勾选的顺序，不要随意改动
curseforge_project_id=1740380
curseforge_release_type=release
curseforge_game_versions=1.20.2,1.20.3,1.20.4
license=AGPL-3.0-only
credits=
description=[EN] Browse, search and transfer items across nearby containers from one portable terminal. [CN] \u7528\u4e00\u4e2a\u968f\u8eab\u7ec8\u7aef\u6d4f\u89c8\u3001\u641c\u7d22\u5e76\u5b58\u53d6\u9644\u8fd1\u5bb9\u5668\u4e2d\u7684\u7269\u54c1\u3002Issues: https://github.com/Huziyang520/Portable-Terminal/issues
minecraft_version_range=[1.20.2, 1.20.5)
# Same range, in the prefix-constraint syntax Fabric Loader understands.
fabric_minecraft_range=>=1.20.2 <1.20.5
# Branch / jar range label (directory name = git branch name = this label)
mc_range_label=1.20.2-1.20.4

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.97.3+1.20.4
fabric_loader_version=0.14.24

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=20.4.251
neoforge_loader_version_range=[1,)
# Lower bound = the loader line that the branch's lower Minecraft release ships with.
neoforge_version_range=[1,)
# NeoForm version used to remap the 'common' module (taken from the local Gradle cache).
neo_form_version=1.20.4-20240627.114801

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
