plugins {
    id 'multiloader-common'
}

// 区间决定 common 的编译后端：1.20.1 走 Loom（Forge/Fabric 都用这套映射），1.20.2+ 走 ModDevGradle 的 NeoForm。
def backend = findProperty('common_backend') ?: 'moddev'

if (backend == 'loom') {
    apply plugin: 'fabric-loom'

    loom {
        // access widener 也可能来自 overlay（区间之间条目不同）。
        accessWidenerPath = pickResource("${mod_id}.accesswidener")
    }
} else {
    apply plugin: 'net.neoforged.moddev'

    neoForge {
        neoFormVersion = neo_form_version
        accessTransformers.from(pickResource('META-INF/accesstransformer.cfg').absolutePath)
    }
}

repositories {
    // 可选前置只编译期引用，运行时缺失必须不报错。
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    // 可选：配置界面。Cloth Config 不是必需依赖。
    if (backend == 'loom') {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()
        modCompileOnly("${cloth_config_common}") { transitive = false }
    } else {
        compileOnly("${cloth_config_common}") { transitive = false }
    }
    // 可选：JEI 避让。只编译期引用仓库内自带的 API 工件，不打包、不设必装依赖。
    compileOnly files("libs/${jei_api_jar}")
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    // 资源可能有多个源根（overlay 在前、主干在后），逐个登记成工件。
    sourceSets.main.resources.srcDirs.each { commonResources it }
}

// 20.x 的 net.neoforged:neoforge 会经 net.minecraftforge:unsafe 传递依赖 log4j 的动态版本（2.11.+）。
// 动态版本要先取模块版本清单，而本机对 maven.neoforged.net 不可达、拉清单会一直挂住；
// 这里直接钉到缓存里已有的具体版本，解析结果与联网一致且不再依赖网络。
def log4jPin = findProperty('log4j_pin')
if (log4jPin != null) {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.apache.logging.log4j' && details.requested.version.endsWith('+')) {
                details.useVersion log4jPin.toString()
            }
        }
    }
}
