plugins {
    id 'multiloader-common'

    id 'net.neoforged.moddev'}

neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

repositories {
    // Optional integrations: never bundled, only compiled against, and guarded at runtime.
    maven { url = 'https://maven.shedaniel.me/' }                // Cloth Config
    maven { url = 'https://maven.terraformersmc.com/releases/' } // Mod Menu
}

dependencies {
    // Optional: config screen. Cloth Config is not a required dependency.
    compileOnly('me.shedaniel.cloth:cloth-config-fabric:26.3.159') { transitive = false }
	// Optional: JEI avoidance. JEI is not a required dependency and is never bundled.
	// Optional: JEI avoidance. The API jar is vendored under common/libs and is only
	// compiled against (never bundled, never required at runtime).
	compileOnly files('libs/jei-26.3-common-api-31.12.0.65.jar')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
