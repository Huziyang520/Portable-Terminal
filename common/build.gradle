plugins {
    id 'multiloader-common'

    id 'net.neoforged.moddev'}

neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

repositories {
    // Optional integrations: never bundled, only compiled against, and guarded at runtime.
    maven { url = 'https://maven.shedaniel.me/' }                // Cloth Config
    maven { url = 'https://maven.terraformersmc.com/releases/' } // Mod Menu
}

dependencies {
    // Optional: config screen. Cloth Config is not a required dependency.
    // common 由 ModDevGradle 以官方映射编译，fabric 工件是 intermediary 的，只能引 neoforge 工件。
    compileOnly('me.shedaniel.cloth:cloth-config-neoforge:15.0.140') { transitive = false }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
