plugins {
    id 'multiloader-common'

    id 'net.neoforged.moddev'}

neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

repositories {
    // Optional integrations: never bundled, only compiled against, and guarded at runtime.
    maven { url = 'https://maven.shedaniel.me/' }                // Cloth Config
    maven { url = 'https://maven.terraformersmc.com/releases/' } // Mod Menu
}

dependencies {
    // Optional: config screen. Cloth Config is not a required dependency.
    // common 由 ModDevGradle 以官方映射编译，fabric 工件是 intermediary 的，只能引 neoforge 工件。
    compileOnly('me.shedaniel.cloth:cloth-config-neoforge:14.0.126') { transitive = false }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// 20.x 的 net.neoforged:neoforge 会经 net.minecraftforge:unsafe:0.2.0 传递依赖 log4j 的动态版本
// （2.11.+）。动态版本需要先取模块的版本清单，而本机对 maven.neoforged.net 不可达、拉清单会一直挂住；
// 这里直接钉到 2.11.+ 实际会解析到的 2.11.2（本地缓存里已有），构建结果不变且不再依赖联网。
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        // 只钉「动态版本」那一条：net.minecraftforge:unsafe 传递过来的是 log4j 的 2.11.+，
        // 动态版本要先取模块版本清单，而这份清单本机拿不到（解析它的仓库都指向不可达的
        // maven.neoforged.net，联网会卡在重试上）。其余 log4j 依赖是 minecraft-dependencies
        // 里的 strict 2.22.1，保持不动；最终版本本来就是 2.22.1，行为与联网解析一致。
        if (details.requested.group == 'org.apache.logging.log4j' && details.requested.version.endsWith('+')) {
            details.useVersion '2.22.1'
        }
    }
}
