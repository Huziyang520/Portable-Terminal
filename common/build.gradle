plugins {
    id 'multiloader-common'

    id 'net.neoforged.moddev'}

neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

repositories {
    // Optional integrations: never bundled, only compiled against, and guarded at runtime.
    maven { url = 'https://maven.shedaniel.me/' }                // Cloth Config
    maven { url = 'https://maven.terraformersmc.com/releases/' } // Mod Menu
}

dependencies {
    // Optional: config screen. Cloth Config is not a required dependency.
    // Fabric 工件是 intermediary 名，MDG 侧的 common（official 名）读不了它；官方映射的 NeoForge 工件才
    // 能在 common 里编译 ModConfigScreen。fabric 模块另用 modCompileOnly 引 fabric 工件。
    compileOnly('me.shedaniel.cloth:cloth-config-neoforge:21.11.150') { transitive = false }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
