modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
# This branch spans 26.1 - 26.2: 26.2+ prefers iconFile, 26.1.x only knows the (now deprecated) logoFile.
iconFile="icon.png"
logoFile="icon.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/portable-terminal"
issueTrackerURL="https://github.com/Huziyang520/Portable-Terminal/issues"
description='''${description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
