plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'net.darkhax.curseforgegradle' version '1.3.33'
}

repositories {
    // Optional integration, compile only. The module compiles the common sources, so it needs the
    // Cloth Config API on its own compile classpath.
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    compileOnly('me.shedaniel.cloth:cloth-config-neoforge:26.3.159') { transitive = false }
}

// CurseForge 发布：gradlew :neoforge:curseforge
tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = project.findProperty('curseforge_api_key')
    def cf = upload(project.curseforge_project_id, tasks.named('jar'))
    cf.displayName = "${mod_name} ${version} (NeoForge)"
    cf.changelog = project.findProperty('curseforge_changelog') ?: "Release ${version}. Full change list: https://github.com/Huziyang520/Portable-Terminal"
    cf.changelogType = 'markdown'
    cf.releaseType = project.curseforge_release_type
    cf.addGameVersion(*project.curseforge_game_versions.split(','))
    cf.addModLoader('NeoForge')
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}
