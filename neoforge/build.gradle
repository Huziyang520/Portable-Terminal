plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    // Optional integration, compile only. The module compiles the common sources, so it needs the
    // Cloth Config API on its own compile classpath.
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    compileOnly('me.shedaniel.cloth:cloth-config-neoforge:13.0.112') { transitive = false }
    // JEI（可选前置）：只编译期引用仓库内自带的 API 工件；不打包、不设必装依赖。
    compileOnly files('../common/libs/jei-1.20.4-common-api-17.3.1.5.jar')
}

// 本分支的 Gradle 跑在 Java 21/17 上，而 CurseForgeGradle 1.3.33 要求 JVM 25 ⇒ 不能作为构建插件加载。
// 发布统一走 文档/上传脚本 的 gradle init 脚本（cfUpload / mrUpload），本文件不再注册 curseforge 任务。

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// 20.x 的 net.neoforged:neoforge 会经 net.minecraftforge:unsafe:0.2.0 传递依赖 log4j 的动态版本
// （2.11.+）。动态版本需要先取模块的版本清单，而本机对 maven.neoforged.net 不可达、拉清单会一直挂住；
// 这里只把这条**动态版本**钉到 FancyModLoader 2.0.17 / minecraft-dependencies 本来就要求的那一档
// （其余路径是 strict 2.19.0，缓存里已有），最终解析结果与联网一致，且不再依赖联网。
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.logging.log4j' && details.requested.version.endsWith('+')) {
            details.useVersion '2.19.0'
        }
    }
}
