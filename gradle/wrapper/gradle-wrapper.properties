# === Gradle 版本锁定 ===
# 档位：遗留档 8.11（ForgeGradle 6 只支持 Gradle 8.x；Loom 1.8-SNAPSHOT 亦只在此档可用）
# 约束来源：ForgeGradle 6 / fabric-loom 1.8-SNAPSHOT
# 复用本机缓存：是（本机 wrapper/dists 已缓存 8.11 与 9.6.1）；改动前先查 ~/.gradle/wrapper/dists
# 镜像：腾讯云 gradle 发行版镜像（见下 distributionUrl）
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
